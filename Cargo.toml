[package]
name = "qrcode-app"
version = "0.2.0"
authors = ["Tyler Colby"]
edition = "2021"
description = "QR code generator for Precursor: versions 1-10, EC L/M/Q/H"
license = "Apache-2.0"

# Lives at xous-core/apps/qrcode-app/ (see xous-dev-toolkit/bin/integrate).
[dependencies]
log = "0.4.14"
num-derive = { version = "0.4.2", default-features = false }
num-traits = { version = "0.2.14", default-features = false }
xous = "0.9.71"
log-server = { package = "xous-api-log", version = "0.1.70" }
xous-names = { package = "xous-api-names", version = "0.9.72" }
gam = { path = "../../services/gam" }
precursor-appkit = { path = "../../libs/precursor-appkit" }
qrcode-app-core = { path = "core" }

[features]
default = []
